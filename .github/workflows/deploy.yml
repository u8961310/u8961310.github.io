name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # 每週一 04:00 (Asia/Taipei, UTC+8) 重建一次。
  # P0 階段是 no-op；P1 接上 GitHub API 之後，新開的 repo 會靠這個排程自動上架。
  schedule:
    - cron: '0 20 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署，但不取消進行中的（避免半途中斷留下壞狀態）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Astro site
        uses: withastro/action@v6
        env:
          # 未帶 token 時 GitHub API 每 IP 每小時只有 60 次，Actions runner
          # 是共用 IP 很容易撞到；帶上內建 token 拉到 5000 次。
          # 取不到時 build 不會失敗，只會回落到 repos-snapshot.json。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
