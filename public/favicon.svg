<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Cake">
  <!-- 沿用首頁點陣的語彙：一格被「點亮」的點。
       16px 下 3x3 會糊成一團，所以用 2x2 並讓右上那顆明顯放大。 -->
  <rect width="32" height="32" rx="7" fill="#0d9488" />
  <g fill="#ffffff">
    <circle cx="11" cy="11" r="2.1" opacity="0.45" />
    <circle cx="11" cy="21" r="2.1" opacity="0.45" />
    <circle cx="21" cy="21" r="2.1" opacity="0.45" />
    <circle cx="21" cy="11" r="3.6" />
  </g>
</svg>
